[package]
name = "wezterm-attention"
version = "2.0.0"
edition = "2024"
rust-version = "1.94"

[lib]
name = "wezterm_attention"
path = "src/lib.rs"

[[bin]]
name = "attention"
path = "src/main.rs"

[[test]]
name = "claim_publish_spec"
path = "tests/rust/claim_publish_spec.rs"

[[test]]
name = "lifecycle_spec"
path = "tests/rust/lifecycle_spec.rs"

[[test]]
name = "maintenance_spec"
path = "tests/rust/maintenance_spec.rs"

[[test]]
name = "cli_shell_spec"
path = "tests/rust/cli_shell_spec.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
