[package]
name = "wezterm-attention"
version = "1.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
repository = "https://github.com/pro-vi/wezterm-attention"

[lib]
name = "wezterm_attention"
path = "src/lib.rs"

[[bin]]
name = "attention"
path = "src/main.rs"

[[test]]
name = "claim_publish_spec"
path = "tests/rust/claim_publish_spec.rs"

[[test]]
name = "lifecycle_spec"
path = "tests/rust/lifecycle_spec.rs"

[[test]]
name = "maintenance_spec"
path = "tests/rust/maintenance_spec.rs"

[[test]]
name = "cli_shell_spec"
path = "tests/rust/cli_shell_spec.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

# Denied because the crate is already clean of them, so the table and the
# crate-root attributes lock that in rather than announcing an intention.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
enum_glob_use = "deny"
exit = "deny"
fn_params_excessive_bools = "deny"
match_wildcard_for_single_variants = "deny"
todo = "deny"
unimplemented = "deny"
# The lints denied by the `cfg_attr` at the top of src/lib.rs and src/main.rs are
# kept out of this table, which also covers `build.rs` and the tests. `build.rs`
# prints cargo directives on stdout and reads `CARGO_MANIFEST_DIR` with `expect`; the
# tests use unsafe blocks without `// SAFETY:` comments, `unwrap`, `expect`, `panic!`
# and `println!`.
